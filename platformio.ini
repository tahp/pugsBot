[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Customizing for N16R8 (16MB Flash / 8MB PSRAM)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

; For the dual USB/S3 board, we ensure it's targeting the right hardware
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Dependencies (We will add LVGL or TFT_eSPI here once we select the driver)
lib_deps = 

; Monitor settings
monitor_speed = 115200
